<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Interactive Rubik</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
      #ui-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px;
        border-radius: 15px;
        font-family: Arial, sans-serif;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        z-index: 999;
      }
      .upload-btn {
        display: inline-block;
        background: #00ecff;
        color: #111;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        border: none;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      .upload-btn:hover { background: #00bcd4; }
      #file-input { display: none; }
      p { margin: 5px 0 10px 0; font-size: 13px; color: #333; line-height: 1.4; }
    </style>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">

    <div id="ui-container">
      <p><b>Interaktif AR:</b> Guna 1 jari untuk <b>pusingkan cube</b>, guna 2 jari (pinch) untuk <b>besarkan/kecilkan</b>.<br>Anda juga boleh muat naik gambar latar belakang di bawah.</p>
      <label for="file-input" class="upload-btn">📁 Upload Photo</label>
      <input type="file" id="file-input" accept="image/*">
    </div>
    
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;"
      gesture-detector>
      
      <a-assets>
        <a-asset-item id="rubik-model" src="rubiks_cube.glb"></a-asset-item>
        <img id="uploaded-img-src" src="">
      </a-assets>

      <a-entity position="0 -0.2 -2.0">
        
        <a-plane id="photo-plane" 
                 position="0 0 0" 
                 rotation="-90 0 0" 
                 width="1.6" 
                 height="1.6" 
                 material="src: #uploaded-img-src; transparent: true; opacity: 0"
                 visible="false">
        </a-plane>

        <a-entity 
          id="rubik-cube"
          gltf-model="#rubik-model" 
          scale="0.5 0.5 0.5" 
          position="0 0.3 0"
          class="cantap"
          gesture-handler="minScale: 0.1; maxScale: 3">
        </a-entity>
        
      </a-entity>
      
      <a-entity camera="fov: 80" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse"></a-entity>
    </a-scene>

    <script>
      document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            document.getElementById('uploaded-img-src').setAttribute('src', event.target.result);
            const plane = document.getElementById('photo-plane');
            plane.setAttribute('visible', 'true');
            plane.setAttribute('material', 'src: #uploaded-img-src; opacity: 1; shader: flat;');
          }
          reader.readAsDataURL(file);
        }
      });
    </script>
    
  </body>
</html>
